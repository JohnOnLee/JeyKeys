<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny Farm Tiles Preview</title>
  <style>
    body {
      background-color: #1e293b;
      color: white;
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 15px;
      margin-top: 30px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .card img {
      width: 48px;
      height: 48px;
      image-rendering: pixelated;
    }
    .card span {
      font-size: 0.75rem;
      color: #fbbf24;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Tiny Farm Tiles Preview</h1>
  <p>Open this page to see the tile mappings for the farm builder items!</p>
  <div class="grid" id="grid"></div>

  <script>
    const grid = document.getElementById('grid');
    for (let i = 0; i <= 131; i++) {
      const numStr = String(i).padStart(4, '0');
      const filename = `tile_${numStr}.png`;
      const path = `/assets/tinyFarm/Tiles/${filename}`;
      
      const card = document.createElement('div');
      card.className = 'card';
      
      const img = document.createElement('img');
      img.src = path;
      img.alt = filename;
      
      const span = document.createElement('span');
      span.textContent = filename;
      
      card.appendChild(img);
      card.appendChild(span);
      grid.appendChild(card);
    }
  </script>
</body>
</html>
