<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKeys - Kids Typing Adventure</title>
    <style>
        :root {
            --primary: #22c55e;
            --secondary: #10b981;
            --accent: #a3e635;
            --bg-color: #064e3b;
            --text-color: #ffffff;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);

            /* Finger Colors */
            --f-pinky: #f87171;
            --f-ring: #fbbf24;
            --f-middle: #34d399;
            --f-index: #60a5fa;
            --f-thumb: #a78bfa;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Nunito', sans-serif;
            background: radial-gradient(circle at center, #065f46 0%, #022c22 100%);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }


        /* --- Story Feature Styles --- */
        .story-launch-btn {
            width: 100%;
            font-size: 1rem;
            padding: 8px;
            margin-top: 2px;
        }

        .genre-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            padding: 4px;
        }

        .genre-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .genre-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .genre-card .genre-icon {
            font-size: 2rem;
        }

        .genre-card .genre-name {
            font-size: 0.85rem;
            margin-top: 4px;
            font-weight: bold;
        }

        .story-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            max-height: 55vh;
            overflow-y: auto;
            padding: 4px;
        }

        .story-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .story-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* --- UI Components --- */
        .container {
            width: 100%;
            max-width: 1000px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--glass-border);
            position: relative;
            z-index: 100;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            text-shadow: 0 0 10px var(--primary);
        }

        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            padding: 10px 20px;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-small {
            padding: 5px 15px;
            font-size: 0.9rem;
        }

        .btn-back {
            background: #4b5563;
        }

        /* --- Screens --- */
        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px;
            animation: fadeIn 0.5s ease;
            overflow-y: hidden;
        }

        .screen.active {
            display: flex;
        }

        .screen.game-mode {
            justify-content: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Main Menu - New Layout (Index-3 Style) */
        .menu-section {
            width: 100%;
            max-width: 800px;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 1.4rem;
            color: var(--accent);
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid var(--glass-border);
            padding-bottom: 5px;
            display: inline-block;
            width: 100%;
        }

        /* Grid for Fingers (Top) */
        .drills-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .drill-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }

        .drill-card:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary);
        }

        .drill-card h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .drill-card p {
            margin: 5px 0 0;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* Grid for Adventure (Bottom) */
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .level-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 8px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .level-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--secondary);
        }

        .level-num {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 2px;
            color: var(--accent);
        }

        .level-name {
            font-size: 0.7rem;
            opacity: 0.9;
            line-height: 1.1;
        }

        .stars {
            margin-top: 2px;
            font-size: 0.7rem;
            color: #444;
        }

        .star.filled {
            color: #fbbf24;
            text-shadow: 0 0 5px #fbbf24;
        }

        /* Game Area (Index-1 Base) */
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 30px;
            border-radius: 30px;
        }

        .display-area {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 30px;
            border-radius: 15px;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            width: 100%;
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.5);
            position: relative;
            text-align: left;
            line-height: 1.5;
            font-family: 'Courier New', monospace;
            overflow-y: hidden;
            height: auto;
            min-height: 150px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .char {
            transition: color 0.1s;
            border-radius: 4px;
            display: inline;
        }

        .char.space-char {
            border-bottom: 2px solid #ccc;
            border-radius: 0;
            opacity: 0.5;
        }

        .char.enter-char {
            color: var(--primary);
            font-size: 0.8em;
            width: auto;
            margin-left: 5px;
        }

        .char.enter-char::after {
            content: "↵";
        }

        .char.correct {
            color: #16a34a;
            background: transparent;
        }

        .char.incorrect {
            color: #dc2626;
            text-decoration: underline;
            background: #fee2e2;
        }

        .char.current {
            background: var(--primary);
            color: white;
            border-radius: 4px;
            animation: none;
            border-bottom: none;
        }

        .char.pending {
            color: #9ca3af;
        }

        @keyframes pulse {
            50% {
                border-color: transparent;
            }
        }

        /* --- Virtual Keyboard --- */
        .keyboard {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            transform: scale(0.9);
        }

        .row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .key {
            width: 45px;
            height: 45px;
            background: #374151;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 0 #1f2937;
            position: relative;
            font-size: 1rem;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .key.active {
            transform: translateY(4px);
            box-shadow: none !important;
            filter: brightness(1.2);
        }

        .key.target {
            animation: targetPulse 1s infinite;
            border: 2px solid white;
            z-index: 10;
        }

        @keyframes targetPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 255, 255, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }

        /* Finger Color Coding */
        .f-pinky {
            border-bottom: 4px solid var(--f-pinky);
        }

        .f-ring {
            border-bottom: 4px solid var(--f-ring);
        }

        .f-middle {
            border-bottom: 4px solid var(--f-middle);
        }

        .f-index {
            border-bottom: 4px solid var(--f-index);
        }

        .f-thumb {
            border-bottom: 4px solid var(--f-thumb);
        }

        /* Special Keys */
        .k-space {
            width: 250px;
        }

        .k-shift {
            width: 100px;
        }

        .k-back {
            width: 80px;
            font-size: 0.8rem;
        }

        .k-tab {
            width: 70px;
            font-size: 0.8rem;
        }

        .k-caps {
            width: 80px;
            font-size: 0.8rem;
        }

        .k-enter {
            width: 90px;
            font-size: 0.8rem;
        }

        /* Hand Indicators */
        .hand-indicators {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
            padding: 0 20px;
        }

        .hand {
            font-size: 1.2rem;
            font-weight: bold;
            opacity: 0.3;
            transition: opacity 0.2s;
        }

        .hand.active {
            opacity: 1;
            text-shadow: 0 0 10px white;
        }

        /* Modal / Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .overlay.active {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, #4c1d95, #8b5cf6);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid var(--accent);
            max-width: 400px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .modal h2 {
            font-size: 2.5rem;
            margin-top: 0;
            color: #fbbf24;
        }

        .score-big {
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f0f;
            animation: fall linear forwards;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(220, 38, 38, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 200;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.27);
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* --- Theme Picker --- */
        .theme-wrapper {
            position: relative;
            z-index: 500;
        }

        .theme-panel {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            background: rgba(15, 15, 25, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 16px;
            width: 240px;
            z-index: 500;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(-8px) scale(0.95);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .theme-panel.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        .theme-panel-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.5;
            margin-bottom: 12px;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .theme-swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-swatch:hover {
            transform: scale(1.15);
        }

        .theme-swatch.active {
            border-color: white;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .theme-swatch .swatch-label {
            font-size: 0.55rem;
            font-weight: bold;
            white-space: nowrap;
            color: white;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }

        .theme-custom-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .theme-custom-row label {
            font-size: 0.8rem;
            font-weight: bold;
            flex: 1;
        }

        .theme-color-input {
            -webkit-appearance: none;
            appearance: none;
            width: 36px;
            height: 36px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            padding: 0;
            overflow: hidden;
        }

        .theme-color-input::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .theme-color-input::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
        }

        .theme-color-input::-moz-color-swatch {
            border: none;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>✨ JKeys - Kids Typing Adventure</h1>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span
                    style="font-size: 0.9rem; font-weight: bold; color: #fbbf24; text-shadow: 0 0 5px rgba(0,0,0,0.5);">High
                    Score: <span id="menu-highscore">0</span></span>
                <button class="btn btn-small" style="background:linear-gradient(45deg, #fbbf24, #f59e0b)"
                    onclick="app.startMode('game')">⭐ Star Rush</button>
                <div class="theme-wrapper">
                    <button id="theme-btn" class="btn btn-small"
                        style="background:linear-gradient(45deg, #ec4899, #8b5cf6)">🎨 Theme</button>
                    <div id="theme-panel" class="theme-panel">
                        <div class="theme-panel-title">Choose Theme</div>
                        <div class="theme-grid" id="theme-grid"></div>
                        <div class="theme-custom-row">
                            <label>✨ Custom</label>
                            <input type="color" id="theme-custom-color" class="theme-color-input" value="#22c55e">
                        </div>
                    </div>
                </div>
                <button id="mute-btn" class="btn btn-small">🔊 Sound On</button>
            </div>
        </header>

        <!-- Main Menu -->
        <div id="menu-screen" class="screen active">

            <!-- Section 1: Finger Drills (Index-3 Style Order: Top) -->
            <div class="menu-section">
                <div class="section-title">🖐 Finger Drills</div>
                <div class="drills-grid" id="drills-container">
                    <!-- Javascript will populate -->
                </div>
            </div>

            <!-- Section 2: Adventure Levels -->
            <div class="menu-section">
                <div class="section-title">🌈 Adventure Levels</div>
                <div class="levels-grid" id="levels-container">
                    <!-- Javascript will populate -->
                </div>
            </div>


            <!-- Section 3: Type a Story -->
            <div class="menu-section">
                <div class="section-title">📖 Type a Story</div>
                <button class="btn story-launch-btn" onclick="app.showStoryGenreSelection()">Choose a Story</button>
            </div>

        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen game-mode">
            <div class="stats-bar">
                <div>Time: <span id="timer">00:00</span></div>
                <div>Score: <span id="score">0</span></div>
                <div>Level: <span id="level-name">--</span></div>
                <button class="btn btn-small btn-back" onclick="app.showMenu()">Exit</button>
            </div>

            <div id="display-area" class="display-area">
                Click "Start" to begin...
            </div>

            <div class="hand-indicators">
                <div id="hand-left" class="hand">LEFT HAND <span id="finger-name-left"
                        style="color: var(--accent);"></span></div>
                <div id="hand-right" class="hand"><span id="finger-name-right" style="color: var(--accent);"></span>
                    RIGHT HAND</div>
            </div>

            <div class="keyboard" id="keyboard">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <!-- Results Modal -->
    <div id="result-modal" class="overlay">
        <div class="modal">
            <h2 id="result-title">Good Job!</h2>
            <p>Your Score:</p>
            <div class="score-big" id="result-score">100</div>
            <p id="result-wpm" style="font-size: 1.2rem; margin: -10px 0 15px 0; opacity: 0.8">WPM: 0</p>
            <div id="result-stars" style="font-size: 2rem; margin-bottom: 20px;"></div>
            <p id="result-msg">Keep practicing!</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn" onclick="app.showMenu()">Menu</button>
                <button class="btn" onclick="app.retry()">Retry</button>
                <button id="btn-next-level" class="btn"
                    style="background: linear-gradient(45deg, #10b981, #059669); display: none;">Next ➡</button>
            </div>
        </div>
    </div>

    <!-- Story Genre Modal -->
    <div id="story-genre-modal" class="overlay">
        <div class="modal" style="max-width: 500px;">
            <h2>📖 Pick a Genre</h2>
            <div id="genre-container" class="genre-grid"></div>
            <button class="btn" onclick="document.getElementById('story-genre-modal').classList.remove('active')"
                style="margin-top: 12px;">Back</button>
        </div>
    </div>

    <!-- Story Selection Modal -->
    <div id="story-selection-modal" class="overlay">
        <div class="modal" style="max-width: 500px;">
            <h2 id="story-genre-title">Pick a Story</h2>
            <div id="story-container" class="story-grid"></div>
            <button class="btn"
                onclick="document.getElementById('story-selection-modal').classList.remove('active'); document.getElementById('story-genre-modal').classList.add('active')"
                style="margin-top: 12px;">Back</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script>
        class TypingApp {
            constructor() {
                this.soundEnabled = true;
                this.currentMode = null; // 'drill', 'adventure', 'game'
                this.currentLevelIndex = 0;
                this.score = 0;
                this.timer = 0;
                this.timerInterval = null;
                this.text = "";
                this.currentIndex = 0;
                this.isPlaying = false;

                // --- THEME DATA ---
                this.themes = {
                    forest: { name: 'Forest', primary: '#22c55e', secondary: '#10b981', accent: '#a3e635', bgStart: '#065f46', bgEnd: '#022c22' },
                    ocean: { name: 'Ocean', primary: '#3b82f6', secondary: '#2563eb', accent: '#67e8f9', bgStart: '#1e3a5f', bgEnd: '#0c1929' },
                    galaxy: { name: 'Galaxy', primary: '#8b5cf6', secondary: '#7c3aed', accent: '#c4b5fd', bgStart: '#3b1f6e', bgEnd: '#1a0a3e' },
                    lava: { name: 'Lava', primary: '#ef4444', secondary: '#dc2626', accent: '#fca5a5', bgStart: '#7f1d1d', bgEnd: '#3b0d0d' },
                    sunset: { name: 'Sunset', primary: '#f97316', secondary: '#ea580c', accent: '#fde68a', bgStart: '#7c2d12', bgEnd: '#3b1106' },
                    candy: { name: 'Candy', primary: '#ec4899', secondary: '#db2777', accent: '#f9a8d4', bgStart: '#701a48', bgEnd: '#3b0d26' }
                };
                this.activeTheme = 'forest';

                // --- DATA SOURCES ---

                // From Index-1: Drills
                this.drills = [
                    { name: "Home Row", chars: "asdfjkl;", content: "asdf jkl;\nsad dad lad\nflask fall" },
                    { name: "Top Row", chars: "qwertyuiop", content: "qwerty uiop\npot top tree\nquiet port" },
                    { name: "Bottom Row", chars: "zxcvbnm,./", content: "zxcv bnm,./\nvan cab man\nzone calm" },
                    { name: "Capitals", chars: "ABCDEFGHIJKLMNOPQRSTUVWXYZ", content: "Hello World\nMagic Star\nMoon Light" }
                ];

                            { title: "How Plants Grow", content: "Plants need lots of clean water and bright warm sunlight every single day to grow.\nThe deep roots drink up water from the dark brown dirt deep under the ground below.\nThe bright warm sun helps the green leaves make yummy food for the whole plant.\nThe strong green stem holds the whole plant up tall and straight toward the sky.\nThe colorful flower makes tiny seeds that will grow into brand new baby green plants.\nThe strong wind blows all of the tiny little seeds very far away across the land." },
                            { title: "The Deep Ocean", content: "The ocean is very incredibly deep and dark in the places far below the surface.\nMany strange and amazing looking fish live at the very bottom of the deep ocean.\nSome really cool fish even have bright glowing lights right on the top of their heads.\nThey use their bright lights to help them find yummy food in the total dark water.\nIt is very cold and freezing in the deep water where the sunlight cannot reach.\nThe water pressure is very strong and heavy down at the deepest bottom of the ocean." },
                            { title: "Amazing Ants", content: "Ants are very strong and hardworking little bugs that never ever take a break.\nThey can carry really heavy big pieces of food that weigh much more than themselves.\nThey work closely together as a big team to build their amazing underground home.\nTheir underground home has many small winding tunnels and rooms deep under the dirt ground.\nThey follow a special invisible scent trail on the ground to find their way to food.\nThe special queen ant stays deep inside the home and lays all of the tiny eggs." },
                            { title: "The Solar System", content: "The sun is a very big and incredibly hot bright glowing star in our solar system.\nEight different planets all travel and go around the sun in their own special path.\nEarth is the third planet from the sun and it is where all of us live.\nEarth has one big round moon that orbits and goes around our planet every month.\nJupiter is the biggest and most giant planet of all the eight planets in space.\nPluto is a very small and tiny dwarf planet that is extremely far away from us." },
                            { title: "Bones in Your Body", content: "Your amazing body has over two hundred hard and strong bones inside of it right now.\nAll of your strong bones help you stand up tall and straight and walk every day.\nYour hard skull is a special bone that carefully protects your very important soft brain.\nYour curved ribs are bones that protect your beating heart and your breathing lungs inside you.\nYou have lots of tiny little bones in both your hands and both your feet too.\nDrink plenty of cold white milk every day to keep all of your bones very strong." },
                            { title: "Fast Cheetahs", content: "The cheetah is a beautiful wild cat with golden fur and small round black spotted marks.\nIt is the fastest running animal on all of the land in the entire whole world.\nIt runs incredibly fast to quickly catch its dinner before the other animals can escape.\nIt has special dark spots on its fur to hide in the tall brown dry grass.\nIt gets very tired and needs to rest after it finishes one of its super fast runs.\nIt rests and cools down in the dark shade under a big tall wide spreading tree." }

                        stories: [
                            { title: "The Dancing Pig", content: "The pink round pig put on a pair of really shiny sparkly gold tap dancing shoes.\nHe did the funniest silly tap dance right in the middle of the wet brown mud.\nAll the black and white spotted cows standing nearby laughed out really really very loud.\nHe slipped and fell right over into a very large and deep muddy brown puddle.\nThe brown mud splashed everywhere and got all over every single one of the clean cows.\nNow all of the dirty muddy cows and the silly pig all needed a big bath." },
                            { title: "The Sneezing Elephant", content: "The big gray elephant accidentally smelled some very strong and spicy hot black pepper today.\nHe let out the most giant and incredibly powerful loud sneeze anyone has ever heard.\nThe powerful sneeze blew all of the green leaves right off of the tall oak tree.\nThe poor little birds suddenly and sadly lost their safe and cozy warm little homes.\nThe sorry elephant felt really bad and said he was so very truly deeply sorry.\nHe helped every single one of the little birds build brand new strong cozy nests." },
                            { title: "The Cow Who Wanted to Fly", content: "Bessie the spotted cow flapped her front legs up and down as hard as she could.\nShe tried so very hard to fly high up in the sky like a little bird.\nShe only jumped up and over a very small rock sitting in the green grass.\nA little bird flew down and kindly told her that cows simply can not ever fly.\nShe was a little bit sad but she bravely and stubbornly kept on trying every day.\nOne very lucky day she found a shiny silver jetpack sitting right behind the red barn." },

                            { title: "The Frog's Song", content: "The little green frog tried his very best to sing a really sweet and beautiful song.\nBut only a very loud and funny deep croak sound came out of his wide mouth.\nThe fish in the pond quickly covered their ears and swam far far away from him.\nThe other frogs who were his friends all kindly said that his singing was truly great.\nThey all got together and happily made a really loud frog singing and croaking band.\nThey croaked and sang their silly songs very loudly together all through the dark long night." }

                            { title: "The Big Jump", content: "Leo stood all the way at the very end of the long bouncy diving board today.\nHe took a really big and deep breath and then jumped as high as he could.\nSplash! The water went flying up everywhere and got all the people near the pool wet.\nHe went all the way down and touched the very bottom of the deep swimming pool.\nHe kicked his feet hard and swam really fast all the way back up to the top.\nHe smiled very wide and wiped the water from his eyes and then climbed out happily." },
                            { title: "Swimming Lesson", content: "Maya kicked her feet as hard as she could in the warm blue swimming pool water.\nShe held on very tightly to the red kickboard while her teacher watched her swim.\nHer swimming teacher smiled a really big smile and clapped her hands with great pride.\nShe learned to put her whole face bravely in the water and hold her breath tight.\nShe blew lots of tiny fun bubbles from her nose while her face was under water.\nShe is now a very brave and confident and strong little swimmer in the big pool." },

                            { title: "The Water Slide", content: "Sam climbed up the very tall and steep stairs to get to the top of the slide.\nHe slid all the way down the long twisty colorful tube going faster and faster.\nHe splashed with a big loud splash right into the cool blue swimming pool water below.\nHe quickly got out and excitedly went right back up the tall stairs all over again.\nThis time he put his hands up high and went down the slide going super duper fast.\nHe absolutely loves going on the big tall blue twisty water slide more than anything else." },
                            { title: "Finding Coins", content: "We threw lots of shiny toy coins into the bottom of the deep blue swimming pool.\nWe all took a big deep breath and dove down to the very bottom of the pool.\nI found three really shiny gold coins sitting on the smooth white bottom of the pool.\nI held my breath for a very long time while I searched all around the bottom.\nIt felt exactly like a really exciting and fun underwater treasure hunt in the deep ocean.\nI put all of the shiny coins I found into the pocket of my swimming shorts." }
                        ]
                    }
                ];

                this.highScore = localStorage.getItem('kidsTypeHighScore') || 0;
                this.levelProgress = JSON.parse(localStorage.getItem('kidsTypeProgress')) || {};

                document.getElementById('menu-highscore').innerText = this.highScore;

                this.initKeyboard();
                this.renderMenu();
                this.initThemePicker();
                this.loadTheme();
                this.bindEvents();
            }

            renderMenu() {
                // 1. Drills
                const drillContainer = document.getElementById('drills-container');
                drillContainer.innerHTML = '';
                this.drills.forEach((drill, idx) => {
                    const card = document.createElement('div');
                    card.className = 'drill-card';
                    card.innerHTML = `<h3>${drill.name}</h3><p>${drill.chars.substring(0, 10)}...</p>`;
                    card.onclick = () => this.startMode('drill', idx);
                    drillContainer.appendChild(card);
                });

                // 2. Adventure Levels
                const levelContainer = document.getElementById('levels-container');
                levelContainer.innerHTML = '';
                this.adventureLevels.forEach((lvl, idx) => {
                    const stars = this.levelProgress[lvl.id] || 0;
                    let starHtml = '';
                    for (let i = 0; i < 3; i++) starHtml += `<span class="star ${i < stars ? 'filled' : ''}">★</span>`;

                    const card = document.createElement('div');
                    card.className = 'level-card';
                    card.innerHTML = `
                        <div class="level-num">${lvl.id}</div>
                        <div class="level-name">${lvl.icon} ${lvl.name}</div>
                        <div class="stars">${starHtml}</div>
                    `;

                    levelContainer.appendChild(card);
                });

            initKeyboard() {
                const kb = document.getElementById('keyboard');
                kb.innerHTML = '';
                this.keyLayout.forEach(row => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'row';
                    row.forEach(k => {
                        const keyDiv = document.createElement('div');
                        keyDiv.className = `key ${k[2]} `;
                        keyDiv.innerText = k[0];
                        keyDiv.dataset.code = k[1];
                        keyDiv.dataset.hand = k[3];
                        rowDiv.appendChild(keyDiv);
                    });
                    kb.appendChild(rowDiv);
                });
            }

            bindEvents() {
                document.addEventListener('keydown', (e) => {
                    if (!this.isPlaying) return;
                    e.preventDefault();
                    this.handleInput(e);
                });

                document.addEventListener('keyup', (e) => {
                    const keyDiv = document.querySelector(`.key[data-code="${e.code}"]`);
                    if (keyDiv) keyDiv.classList.remove('active');
                });

                document.getElementById('mute-btn').addEventListener('click', (e) => {
                    this.soundEnabled = !this.soundEnabled;
                    e.target.innerText = this.soundEnabled ? "🔊 Sound On" : "🔇 Sound Off";
                });

                // Theme panel toggle
                document.getElementById('theme-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    document.getElementById('theme-panel').classList.toggle('open');
                });

                // Close theme panel when clicking outside
                document.addEventListener('click', (e) => {
                    const panel = document.getElementById('theme-panel');
                    if (panel.classList.contains('open') && !e.target.closest('.theme-wrapper')) {
                        panel.classList.remove('open');
                    }
                });

                // Custom color picker
                document.getElementById('theme-custom-color').addEventListener('input', (e) => {
                    this.applyCustomColor(e.target.value);
                });
            }

            playSound(type) {
                if (!this.soundEnabled) return;

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!this.audioCtx) this.audioCtx = new AudioContext();
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();

                const ctx = this.audioCtx;
                const t = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, t);
                    osc.frequency.exponentialRampToValueAtTime(300, t + 0.05);
                    gain.gain.setValueAtTime(0.15, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
                    osc.start(t);
                    osc.stop(t + 0.055);
                } else if (type === 'error') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(100, t);
                    osc.frequency.linearRampToValueAtTime(50, t + 0.1);
                    gain.gain.setValueAtTime(0.2, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                    osc.start(t);
                    osc.stop(t + 0.11);
                } else if (type === 'win') {
                    [500, 600, 700, 800].forEach((freq, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.type = 'sine';
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.1, t + i * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.1);
                        o.start(t + i * 0.08);
                        o.stop(t + i * 0.08 + 0.11);
                    });
                }
            }


            showStoryGenreSelection() {
                const container = document.getElementById('genre-container');
                container.innerHTML = '';
                this.storyGenres.forEach(genre => {
                    const card = document.createElement('div');
                    card.className = 'genre-card';
                    card.innerHTML = `<div class="genre-icon">${genre.icon}</div><div class="genre-name">${genre.name}</div>`;
                    card.onclick = () => this.showStorySelection(genre);
                    container.appendChild(card);
                });
                document.getElementById('story-genre-modal').classList.add('active');
            }

            showStorySelection(genre) {
                document.getElementById('story-genre-modal').classList.remove('active');
                document.getElementById('story-genre-title').innerText = genre.icon + ' ' + genre.name;
                const container = document.getElementById('story-container');
                container.innerHTML = '';
                genre.stories.forEach(story => {
                    const card = document.createElement('div');
                    card.className = 'story-card';
                    card.innerText = story.title;
                    card.onclick = () => {
                        document.getElementById('story-selection-modal').classList.remove('active');
                        this.startStoryMode(story);
                    };
                    container.appendChild(card);
                });
                document.getElementById('story-selection-modal').classList.add('active');
            }

            startStoryMode(story) {
                this.currentMode = 'story';
                document.getElementById('menu-screen').classList.remove('active');
                document.getElementById('game-screen').classList.add('active');
                this.score = 0;
                this.currentIndex = 0;
                this.isPlaying = true;
                this.timer = 0;
                const displayArea = document.getElementById('display-area');
                if (displayArea) displayArea.scrollTop = 0;
                this.text = story.content;
                document.getElementById('level-name').innerText = story.title;
                this.renderText();
                this.updateStats();
                this.highlightNextKey();
                clearInterval(this.timerInterval);
                this.timerInterval = setInterval(() => {
                    this.timer++;
                    this.updateStats();
                }, 1000);
            }

            showMenu() {
                this.isPlaying = false;
                clearInterval(this.timerInterval);
                document.getElementById('menu-screen').classList.add('active');
                document.getElementById('game-screen').classList.remove('active');
                document.getElementById('result-modal').classList.remove('active');
                this.renderMenu(); // Refresh for stars
            }

            startMode(mode, index = 0) {
                this.currentMode = mode;
                this.currentLevelIndex = index;
                document.getElementById('menu-screen').classList.remove('active');
                document.getElementById('game-screen').classList.add('active');
                this.resetGame();
            }

            nextLevel() {
                if (this.currentMode === 'adventure' && this.currentLevelIndex < this.adventureLevels.length - 1) {
                    this.startMode('adventure', this.currentLevelIndex + 1);
                }
                document.getElementById('result-modal').classList.remove('active');
            }

            retry() {
                document.getElementById('result-modal').classList.remove('active');
                this.resetGame();
            }

            showToast(message, duration = 3000) {
                const toast = document.getElementById('toast');
                toast.innerText = message;
                toast.classList.add('show');

                // Clear existing timeout if any
                if (this.toastTimeout) clearTimeout(this.toastTimeout);

                this.toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }

            resetGame() {
                this.score = 0;
                this.currentIndex = 0;
                this.isPlaying = true;
                this.timer = 0; // Default count up

                // Reset Scroll
                const displayArea = document.getElementById('display-area');
                if (displayArea) displayArea.scrollTop = 0;

                // Content Generation
                if (this.currentMode === 'drill') {
                    this.text = this.generateLessonText(this.drills[this.currentLevelIndex].content);
                    document.getElementById('level-name').innerText = this.drills[this.currentLevelIndex].name;
                }
                else if (this.currentMode === 'adventure') {
                    // Convert word list to lines
                    const rawWordsArray = this.adventureLevels[this.currentLevelIndex].words;
                    this.text = this.formatWordsToText(rawWordsArray);
                    document.getElementById('level-name').innerText = this.adventureLevels[this.currentLevelIndex].name;
                }
                else if (this.currentMode === 'game') {
                    this.text = this.generateRandomWords(50);
                    document.getElementById('level-name').innerText = "Star Rush";
                    this.timer = 60; // Count down
                }

                this.renderText();
                this.updateStats();
                this.highlightNextKey();

                // Timer Logic
                clearInterval(this.timerInterval);
                if (this.currentMode === 'game') {
                    this.timerInterval = setInterval(() => {
                        this.timer--;
                        this.updateStats();
                        if (this.timer <= 0) this.endGame();
                    }, 1000);
                } else {
                    this.timerInterval = setInterval(() => {
                        this.timer++;
                        this.updateStats();
                    }, 1000);
                }
            }

            // Helpers to format text consistently
            generateLessonText(seed) {
                if (seed.includes('\n')) return seed;
                let result = seed;
                while (result.length < 50) result += " " + seed;
                return result.substring(0, 100);
            }

            formatWordsToText(originalArray) {
                // Shuffle Array Items - clone first to not mutate original
                let items = [...originalArray].sort(() => Math.random() - 0.5);

                // Ensure enough content for 3 lines by repeating if needed
                while (items.length < 30) {
                    items = items.concat(items);
                }

                let lines = [];
                let currentLine = [];
                const LINE_LENGTH = 42; // Reduced further to prevent enter char overflow

                for (let w of items) {
                    if (lines.length >= 3) break; // Limit to 3 lines

                    if (currentLine.join(' ').length + w.length > LINE_LENGTH) {
                        lines.push(currentLine.join(' '));
                        currentLine = [];
                        if (lines.length >= 3) break;
                    }
                    currentLine.push(w);
                }

                // If we finished words but haven't filled 3 lines, add the last partial line
                if (currentLine.length > 0 && lines.length < 3) {
                    lines.push(currentLine.join(' '));
                }

                // If still less than 3 lines, padding
                while (lines.length < 3) {
                    lines.push(lines[0] || "practice typing");
                }

                return lines.join('\n');
            }

            generateRandomWords(count) {
                // Collect all single words from levels 1-18 (exclude multi-word levels: Book Titles, Phrases, Sentences)
                let allWords = [];
                const singleWordLevelCount = 18;
                for (let i = 0; i < singleWordLevelCount; i++) {
                    allWords = allWords.concat(this.adventureLevels[i].words);
                }
                // Add simple words too
                allWords = allWords.concat(this.simpleWords);

                let res = [];
                for (let i = 0; i < count; i++) {
                    res.push(allWords[Math.floor(Math.random() * allWords.length)]);
                }
                let lines = [];
                while (res.length > 0) lines.push(res.splice(0, 6).join(" "));
                return lines.join("\n");
            }

            renderText() {
                const container = document.getElementById('display-area');
                container.innerHTML = '';

                // Group characters into words so we can wrap them in no-break containers
                let wordGroup = document.createElement('span');
                wordGroup.style.whiteSpace = 'nowrap';
                wordGroup.style.display = 'inline';

                this.text.split('').forEach((char, i) => {
                    if (char === '\n') {
                        // Flush current word group
                        if (wordGroup.childNodes.length > 0) {
                            container.appendChild(wordGroup);
                            wordGroup = document.createElement('span');
                            wordGroup.style.whiteSpace = 'nowrap';
                            wordGroup.style.display = 'inline';
                        }
                        const enterSpan = document.createElement('span');
                        enterSpan.className = 'char enter-char pending';
                        if (i === 0) enterSpan.classList.add('current');
                        container.appendChild(enterSpan);
                        container.appendChild(document.createElement('br'));
                    } else if (char === ' ') {
                        // Flush current word group before the space
                        if (wordGroup.childNodes.length > 0) {
                            container.appendChild(wordGroup);
                            wordGroup = document.createElement('span');
                            wordGroup.style.whiteSpace = 'nowrap';
                            wordGroup.style.display = 'inline';
                        }
                        // Space char goes directly into container (allows line break after it)
                        const span = document.createElement('span');
                        span.innerHTML = '&nbsp;';
                        span.className = 'char pending space-char';
                        if (i === 0) span.classList.add('current');
                        container.appendChild(span);
                    } else {
                        const span = document.createElement('span');
                        span.innerText = char;
                        span.className = 'char pending';
                        if (i === 0) span.classList.add('current');
                        wordGroup.appendChild(span);
                    }
                });

                // Flush remaining word group
                if (wordGroup.childNodes.length > 0) {
                    container.appendChild(wordGroup);
                }
            }

            handleInput(e) {
                if (e.key === 'Shift' || e.key === 'CapsLock' || e.key === 'Alt' || e.key === 'Control') return;

                const keyDiv = document.querySelector(`.key[data-code="${e.code}"]`);
                if (keyDiv) keyDiv.classList.add('active');

                const requiredChar = this.text[this.currentIndex];
                const displayElements = document.getElementById('display-area').querySelectorAll('.char');

                const isEnglishChar = /^[ -~]$/.test(e.key);
                const isControlKey = e.key.length > 1;

                if (!isEnglishChar && !isControlKey) {
                    this.showToast("⚠️ Please switch input source to English!");
                    return;
                }

                let isCorrect = false;

                if (requiredChar === '\n') {
                    if (e.key === 'Enter') isCorrect = true;
                } else {
                    if (e.key === requiredChar) isCorrect = true;
                }

                if (isCorrect) {
                    this.playSound('correct');
                    if (displayElements[this.currentIndex]) {
                        displayElements[this.currentIndex].className = requiredChar === '\n' ? 'char enter-char correct' : 'char correct';
                        if (requiredChar === ' ') displayElements[this.currentIndex].classList.add('space-char');
                    }

                    this.currentIndex++;
                    this.score += 10;

                    if (this.currentIndex >= this.text.length) {
                        if (this.currentMode === 'game') {
                            // Endless mode logic
                            const newWords = "\n" + this.generateRandomWords(5);
                            this.text += newWords;
                            const container = document.getElementById('display-area');
                            newWords.split('').forEach(char => {
                                if (char === '\n') {
                                    const s = document.createElement('span'); s.className = 'char enter-char pending'; container.appendChild(s);
                                    container.appendChild(document.createElement('br'));
                                } else {
                                    const s = document.createElement('span'); s.innerText = char; s.className = 'char pending';
                                    if (char === ' ') { s.innerHTML = '&nbsp;'; s.classList.add('space-char'); }
                                    container.appendChild(s);
                                }
                            });
                            container.scrollTop = container.scrollHeight;
                        } else {
                            this.endGame();
                            return;
                        }
                    }

                    const nextEl = document.getElementById('display-area').querySelectorAll('.char')[this.currentIndex];
                    if (nextEl) {
                        nextEl.classList.add('current');
                        nextEl.scrollIntoView({ behavior: "smooth", block: "center" });
                        this.highlightNextKey();
                    }
                } else {
                    this.playSound('error');
                    if (displayElements[this.currentIndex]) {
                        displayElements[this.currentIndex].classList.add('incorrect');
                    }
                    this.score = Math.max(0, this.score - 5);
                }
                this.updateStats();
            }

            highlightNextKey() {
                document.querySelectorAll('.key.target').forEach(k => k.classList.remove('target'));
                document.getElementById('hand-left').classList.remove('active');
                document.getElementById('hand-right').classList.remove('active');
                document.getElementById('finger-name-left').innerText = "";
                document.getElementById('finger-name-right').innerText = "";

                if (this.currentIndex >= this.text.length) return;

                const char = this.text[this.currentIndex];
                let code = '';

                if (char === '\n') code = 'Enter';
                else code = this.getKeyCode(char);

                const keyDiv = document.querySelector(`.key[data-code="${code}"]`);
                if (keyDiv) {
                    keyDiv.classList.add('target');
                    const hand = keyDiv.dataset.hand;

                    // Determine Finger Name and Color
                    let fingerName = "";
                    let fingerColorVar = "";

                    if (keyDiv.classList.contains('f-pinky')) { fingerName = "Pinky"; fingerColorVar = "var(--f-pinky)"; }
                    else if (keyDiv.classList.contains('f-ring')) { fingerName = "Ring"; fingerColorVar = "var(--f-ring)"; }
                    else if (keyDiv.classList.contains('f-middle')) { fingerName = "Middle"; fingerColorVar = "var(--f-middle)"; }
                    else if (keyDiv.classList.contains('f-index')) { fingerName = "Index"; fingerColorVar = "var(--f-index)"; }
                    else if (keyDiv.classList.contains('f-thumb')) { fingerName = "Thumb"; fingerColorVar = "var(--f-thumb)"; }

                    if (hand === 'L') {
                        document.getElementById('hand-left').classList.add('active');
                        const el = document.getElementById('finger-name-left');
                        el.innerText = ": " + fingerName;
                        el.style.color = fingerColorVar;
                    }
                    if (hand === 'R') {
                        document.getElementById('hand-right').classList.add('active');
                        const el = document.getElementById('finger-name-right');
                        el.innerText = fingerName + " :";
                        el.style.color = fingerColorVar;
                    }

                    if (code === 'Space') {
                        document.getElementById('hand-left').classList.add('active');
                        document.getElementById('hand-right').classList.add('active');

                        const elLeft = document.getElementById('finger-name-left');
                        elLeft.innerText = ": Thumb";
                        elLeft.style.color = "var(--f-thumb)";

                        const elRight = document.getElementById('finger-name-right');
                        elRight.innerText = "Thumb :";
                        elRight.style.color = "var(--f-thumb)";
                    }

                    if (char && char.match(/[A-Z!@#$%^&*()_+{}:"<>?]/)) {
                        const shiftKey = document.querySelector('.key[data-code="ShiftLeft"]');
                        if (shiftKey) shiftKey.classList.add('target');
                    }
                }
            }

            getKeyCode(char) {
                if (char === ' ') return 'Space';
                if (char === ';') return 'Semicolon';
                if (char === ',') return 'Comma';
                if (char === '.') return 'Period';
                if (char === '/') return 'Slash';
                if (char.toUpperCase() >= 'A' && char.toUpperCase() <= 'Z') return 'Key' + char.toUpperCase();
                if (!isNaN(parseInt(char))) return 'Digit' + char;
                return '';
            }

            updateStats() {
                document.getElementById('score').innerText = this.score;
                document.getElementById('timer').innerText = this.currentMode === 'game' ? this.timer + 's' : this.formatTime(this.timer);
            }

            formatTime(s) {
                const m = Math.floor(s / 60);
                const sec = s % 60;
                return `${m}:${sec.toString().padStart(2, '0')} `;
            }

            endGame() {
                this.isPlaying = false;
                clearInterval(this.timerInterval);
                this.playSound('win');

                // Calculate Stats
                let timeSpent = 0;
                if (this.currentMode === 'game') {
                    timeSpent = 60 - this.timer;
                } else {
                    timeSpent = this.timer;
                }
                if (timeSpent < 1) timeSpent = 1;

                // Standard WPM: (Chars / 5) / Minutes
                // Avoid infinite if very fast
                const minutes = timeSpent / 60;
                const wpm = Math.round((this.currentIndex / 5) / minutes);

                let starsEarned = 0;

                // Star Logic
                if (this.currentMode === 'adventure') {
                    starsEarned = 3;

                    // Save
                    const lvlId = this.adventureLevels[this.currentLevelIndex].id;
                    const oldStars = this.levelProgress[lvlId] || 0;
                    if (starsEarned > oldStars) {
                        this.levelProgress[lvlId] = starsEarned;
                        localStorage.setItem('kidsTypeProgress', JSON.stringify(this.levelProgress));
                    }
                }

                // High Score for game mode
                if (this.currentMode === 'game' && this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('kidsTypeHighScore', this.highScore);
                    document.getElementById('menu-highscore').innerText = this.highScore;
                }

                // Show Modal
                document.getElementById('result-score').innerText = this.score;
                document.getElementById('result-wpm').innerText = `WPM: ${wpm} `;

                const starsDiv = document.getElementById('result-stars');
                starsDiv.innerHTML = '';
                if (this.currentMode === 'adventure') {
                    for (let i = 0; i < 3; i++) {
                        starsDiv.innerHTML += `<span style = "color: ${i < starsEarned ? '#fbbf24' : '#ccc'}" >★</span> `;
                    }
                }

                // Next Level Button Logic
                const nextBtn = document.getElementById('btn-next-level');
                if (this.currentMode === 'adventure' && this.currentLevelIndex < this.adventureLevels.length - 1) {
                    nextBtn.style.display = 'block';
                    nextBtn.onclick = () => this.nextLevel();
                } else {
                    nextBtn.style.display = 'none';
                }

                document.getElementById('result-modal').classList.add('active');

                // Confetti
                for (let i = 0; i < 50; i++) {
                    const c = document.createElement('div');
                    c.className = 'confetti';
                    c.style.left = Math.random() * 100 + 'vw';
                    c.style.animationDuration = Math.random() * 2 + 2 + 's';
                    c.style.backgroundColor = `hsl(${Math.random() * 360}, 100 %, 50 %)`;
                    document.body.appendChild(c);
                    setTimeout(() => c.remove(), 4000);
                }
            }
            // --- Theme Methods ---

            initThemePicker() {
                const grid = document.getElementById('theme-grid');
                grid.innerHTML = '';
                for (const [key, theme] of Object.entries(this.themes)) {
                    const swatch = document.createElement('div');
                    swatch.className = 'theme-swatch';
                    swatch.dataset.theme = key;
                    swatch.style.background = `linear-gradient(135deg, ${theme.primary}, ${theme.bgStart})`;
                    swatch.innerHTML = `<span class="swatch-label">${theme.name}</span>`;
                    swatch.addEventListener('click', () => this.applyPresetTheme(key));
                    grid.appendChild(swatch);
                }
            }

            applyPresetTheme(key) {
                const theme = this.themes[key];
                if (!theme) return;
                this.activeTheme = key;

                const root = document.documentElement;
                root.style.setProperty('--primary', theme.primary);
                root.style.setProperty('--secondary', theme.secondary);
                root.style.setProperty('--accent', theme.accent);
                root.style.setProperty('--bg-color', theme.bgStart);
                document.body.style.background = `radial-gradient(circle at center, ${theme.bgStart} 0%, ${theme.bgEnd} 100%)`;

                // Update active swatch indicator
                document.querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('active'));
                const activeSwatch = document.querySelector(`.theme-swatch[data-theme="${key}"]`);
                if (activeSwatch) activeSwatch.classList.add('active');

                // Update the custom color picker to reflect the primary
                document.getElementById('theme-custom-color').value = theme.primary;

                this.saveTheme({ type: 'preset', key });
            }

            applyCustomColor(hex) {
                this.activeTheme = 'custom';

                // Convert hex to HSL to derive secondary and accent
                const r = parseInt(hex.slice(1, 3), 16) / 255;
                const g = parseInt(hex.slice(3, 5), 16) / 255;
                const b = parseInt(hex.slice(5, 7), 16) / 255;
                const max = Math.max(r, g, b), min = Math.min(r, g, b);
                let h, s, l = (max + min) / 2;
                if (max === min) { h = s = 0; } else {
                    const d = max - min;
                    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                    switch (max) {
                        case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                        case g: h = ((b - r) / d + 2) / 6; break;
                        case b: h = ((r - g) / d + 4) / 6; break;
                    }
                }
                const hDeg = Math.round(h * 360);

                const primary = hex;
                const secondary = `hsl(${hDeg}, ${Math.round(s * 100)}%, ${Math.max(Math.round(l * 100) - 10, 15)}%)`;
                const accent = `hsl(${(hDeg + 30) % 360}, 80%, 75%)`;
                const bgStart = `hsl(${hDeg}, ${Math.round(s * 70)}%, ${Math.max(Math.round(l * 40), 10)}%)`;
                const bgEnd = `hsl(${hDeg}, ${Math.round(s * 60)}%, ${Math.max(Math.round(l * 20), 5)}%)`;

                const root = document.documentElement;
                root.style.setProperty('--primary', primary);
                root.style.setProperty('--secondary', secondary);
                root.style.setProperty('--accent', accent);
                root.style.setProperty('--bg-color', bgStart);
                document.body.style.background = `radial-gradient(circle at center, ${bgStart} 0%, ${bgEnd} 100%)`;

                // Clear active swatch
                document.querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('active'));

                this.saveTheme({ type: 'custom', hex });
            }

            saveTheme(data) {
                localStorage.setItem('jkeysTheme', JSON.stringify(data));
            }

            loadTheme() {
                const saved = localStorage.getItem('jkeysTheme');
                if (!saved) {
                    this.applyPresetTheme('forest');
                    return;
                }
                try {
                    const data = JSON.parse(saved);
                    if (data.type === 'preset' && this.themes[data.key]) {
                        this.applyPresetTheme(data.key);
                    } else if (data.type === 'custom' && data.hex) {
                        document.getElementById('theme-custom-color').value = data.hex;
                        this.applyCustomColor(data.hex);
                    } else {
                        this.applyPresetTheme('forest');
                    }
                } catch (e) {
                    this.applyPresetTheme('forest');
                }
            }
        }

        const app = new TypingApp();
    </script>
</body>
